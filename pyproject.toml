[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipscope"
version = "1.0.0"
description = "Official, type-safe Sync & Async Python Server-Side SDK for IPScope IP Intelligence lookups powered by httpx."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "IPScope Engineering" }
]
keywords = ["ip", "geolocation", "asn", "vpn-detection", "ip-intelligence", "ipscope", "httpx"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://ipscope.io"
Documentation = "https://ipscope.io/docs/sdks/python"
Repository = "https://github.com/ipscope-io/ipscope-python"
Issues = "https://github.com/ipscope-io/ipscope-python/issues"

[dependency-groups]
dev = [
  "ruff>=0.14.0",
  "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ipscope"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific rules
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["ipscope"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
